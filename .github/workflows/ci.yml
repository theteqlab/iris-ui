name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast:
    name: Contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-contrast.ts

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  build:
    name: Typecheck, build & test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [19, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Pin React 18
        if: matrix.react == 18
        run: |
          npm pkg set pnpm.overrides.react=18.3.1 pnpm.overrides.react-dom=18.3.1 \
            pnpm.overrides.@types/react=18.3.31 pnpm.overrides.@types/react-dom=18.3.7
      - run: pnpm install ${{ matrix.react == 19 && '--frozen-lockfile' || '--no-frozen-lockfile' }}
      # The docs site (Next.js, Fumadocs) needs React 19; the packages are checked on both.
      - run: pnpm typecheck ${{ matrix.react == 18 && '--filter=!docs' || '' }}
      - run: pnpm build ${{ matrix.react == 18 && '--filter=!docs' || '' }}
      - run: pnpm test

  e2e:
    name: Playground & docs (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
